name: Release macOS Package

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Sync Python env
        run: ./scripts/bootstrap_python.sh

      - name: Verify pinned manifests
        run: uv run python scripts/check_repos_pinned.py ros2.lock.repos third_party.repos

  prepare-release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_exists: ${{ steps.release_check.outputs.release_exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Read project version
        id: version
        run: |
          VERSION="$(awk -F'"' '/^version = / {print $2; exit}' pyproject.toml)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    if: github.ref == 'refs/heads/master' && needs.prepare-release.outputs.release_exists != 'true'
    runs-on: macos-26
    timeout-minutes: 360
    needs:
      - validate-locks
      - prepare-release
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build packaged runtime
        run: ./scripts/build_release.sh

      - name: Verify packaged runtime
        run: FORBIDDEN_REPO_PATH="$GITHUB_WORKSPACE" ./scripts/verify_release_artifact.sh

      - name: Build installer package
        run: ./scripts/package_macos_app.sh

      - name: Verify installer behavior
        run: ./scripts/verify_pkg_install.sh

      - name: Write checksum
        run: shasum -a 256 .release/pkg/ros2native.pkg > .release/pkg/ros2native.pkg.sha256

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ros2native-release-macos-26
          path: |
            .release/pkg/ros2native.pkg
            .release/pkg/ros2native.pkg.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.prepare-release.outputs.tag }}" \
            .release/pkg/ros2native.pkg \
            .release/pkg/ros2native.pkg.sha256 \
            --target "$GITHUB_SHA" \
            --title "${{ needs.prepare-release.outputs.tag }}" \
            --generate-notes

  release-already-exists:
    if: github.ref == 'refs/heads/master' && needs.prepare-release.outputs.release_exists == 'true'
    runs-on: ubuntu-latest
    needs:
      - validate-locks
      - prepare-release
    steps:
      - name: Report skipped release
        run: |
          echo "Release ${{ needs.prepare-release.outputs.tag }} already exists. Skipping publish."
