name: Package Verification

on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Sync Python env
        run: ./scripts/bootstrap_python.sh

      - name: Verify pinned manifests
        run: uv run python scripts/check_repos_pinned.py ros2.lock.repos third_party.repos

  package-macos:
    runs-on: macos-26
    timeout-minutes: 360
    needs: validate-locks
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build packaged runtime
        run: ./scripts/build_release.sh

      - name: Verify packaged runtime
        run: FORBIDDEN_REPO_PATH="$GITHUB_WORKSPACE" ./scripts/verify_release_artifact.sh

      - name: Build installer package
        run: ./scripts/package_macos_app.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ros2native-pkg-macos-26
          path: .release/pkg/ros2native.pkg
